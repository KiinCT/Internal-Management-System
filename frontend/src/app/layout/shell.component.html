<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="sidenav"
  >
    <div class="brand">
      <mat-icon>hub</mat-icon>
      <span>WMS Nội bộ</span>
    </div>
    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let item of nav()"
        [routerLink]="item.link"
        routerLinkActive="active"
        (click)="isMobile() && drawer.close()"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <button mat-icon-button *ngIf="isMobile()" (click)="drawer.toggle()" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="flex-1"></span>

      <button
        mat-icon-button
        [matMenuTriggerFor]="notifMenu"
        (menuOpened)="loadLatest()"
        matTooltip="Thông báo"
      >
        <mat-icon [matBadge]="unread() || null" matBadgeColor="warn" matBadgeSize="small">
          notifications
        </mat-icon>
      </button>
      <mat-menu #notifMenu="matMenu" class="notif-menu" xPosition="before">
        <div class="notif-head" (click)="$event.stopPropagation()">
          <strong>Thông báo</strong>
          <button mat-button color="primary" (click)="readAll()" [disabled]="!unread()">Đánh dấu đã đọc</button>
        </div>
        <button mat-menu-item *ngFor="let n of latest()" (click)="open(n)" [class.unread]="!n.isRead">
          <div class="notif-item">
            <div class="notif-title">{{ n.title }}</div>
            <div class="muted">{{ n.createdAt | date: 'dd/MM HH:mm' }}</div>
          </div>
        </button>
        <div class="empty" *ngIf="!latest().length">Không có thông báo</div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/notifications">Xem tất cả</button>
      </mat-menu>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ auth.user()?.fullName }}</span>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="user-info">
          <div><strong>{{ auth.user()?.fullName }}</strong></div>
          <div class="muted">{{ auth.user()?.email }}</div>
          <div class="muted">{{ auth.user()?.role | label: roleLabels }}</div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile">
          <mat-icon>manage_accounts</mat-icon><span>Tài khoản</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon><span>Đăng xuất</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main>
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
